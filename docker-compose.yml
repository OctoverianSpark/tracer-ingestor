services:
  ingestor:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DB_URL: ${DB_URL}
      SCREENSHOTS_PATH: ${SCREENSHOTS_PATH}
    volumes:
      - screenshots:/app/screenshots

volumes:
  screenshots:
